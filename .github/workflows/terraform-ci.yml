name: Terraform CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate infrastructure and application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: function-app/package-lock.json

      - name: Install application dependencies
        run: npm ci --prefix function-app

      - name: Run application tests
        run: npm test

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without remote state
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f compose.azure.yaml config --quiet
