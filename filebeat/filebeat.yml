# Filebeat tails files read-only and forwards them to the Beats input on Logstash.
# Reference: https://www.elastic.co/guide/en/beats/filebeat/8.19/filebeat-input-filestream.html
# The raw Docker copy is separate from the structured application stream.
# Collect raw Docker and Linux logs; structured business events arrive separately over TCP.
filebeat.inputs:
  - type: filestream
    id: docker-containers
    paths:
      - /var/lib/docker/containers/*/*.log
    parsers:
      - container:
          stream: all
          format: docker
    processors:
      - add_fields:
          target: labels
          fields:
            dataset: docker

  - type: filestream
    id: linux-system
    paths:
      - /var/log/syslog
      - /var/log/auth.log
    processors:
      - add_fields:
          target: labels
          fields:
            dataset: linux

processors:
  - add_host_metadata: ~
  - add_docker_metadata:
      host: unix:///var/run/docker.sock

output.logstash:
  hosts: ["logstash:5045"]

logging.level: warning
