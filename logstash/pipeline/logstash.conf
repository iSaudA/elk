# Azure Functions sends JSON event batches over HTTP; Filebeat sends host and
# container logs over the Beats input.
input {
  # Azure Functions publishes event batches here through Caddy HTTPS. Basic
  # authentication keeps the public /ingest route limited to the simulator.
  http {
    id => "azure_function_events"
    host => "0.0.0.0"
    port => 8080
    user => "azure-function"
    password => "${LOG_INGEST_TOKEN}"
    codec => json {
      ecs_compatibility => "disabled"
    }
    ecs_compatibility => "v8"
  }
  beats {
    host => "0.0.0.0"
    port => 5045
  }
}

filter {
  if ![labels][dataset] {
    mutate {
      add_field => { "[labels][dataset]" => "ayn-al-sijill" }
    }
  }
}

# Daily indices share one prefix so all four Kibana views can search them.
output {
  if [event][id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ELASTICSEARCH_USERNAME:}"
      password => "${ELASTICSEARCH_PASSWORD:}"
      index => "ayn-al-sijill-%{+YYYY.MM.dd}"
      document_id => "%{[event][id]}"
      ilm_enabled => false
      manage_template => false
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ELASTICSEARCH_USERNAME:}"
      password => "${ELASTICSEARCH_PASSWORD:}"
      index => "ayn-al-sijill-%{+YYYY.MM.dd}"
      ilm_enabled => false
      manage_template => false
    }
  }
  stdout {
    codec => dots
  }

  # Optional reporting branch. Elasticsearch remains the operational source;
  # this HTTPS copy feeds Azure SQL for Power BI reporting.
  if "${ANALYTICS_EXPORT_ENABLED:false}" == "true" {
    http {
      url => "${ANALYTICS_INGEST_URL:http://127.0.0.1/disabled}"
      http_method => "post"
      format => "json"
      content_type => "application/json"
      headers => {
        "X-Ayn-Token" => "${ANALYTICS_INGEST_TOKEN:disabled}"
      }
      connect_timeout => 5
      request_timeout => 15
      automatic_retries => 2
      retry_non_idempotent => true
      retry_failed => true
      retryable_codes => [429, 500, 502, 503, 504]
      pool_max => 20
      pool_max_per_route => 10
    }
  }
}
