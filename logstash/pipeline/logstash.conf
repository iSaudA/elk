# Each newline on TCP represents one JSON event; Beats has a separate input.
# Reference: https://www.elastic.co/guide/en/logstash/8.19/plugins-inputs-tcp.html
# Our pipeline mostly passes through JSON already normalized by the replica app.
# Replica Shop sends structured JSON to 5044; Filebeat sends host/container logs to 5045.
input {
  tcp {
    host => "0.0.0.0"
    port => 5044
    codec => json_lines {
      ecs_compatibility => "disabled"
    }
  }
  beats {
    host => "0.0.0.0"
    port => 5045
  }
}

filter {
  if ![labels][dataset] {
    mutate {
      add_field => { "[labels][dataset]" => "ayn-al-sijill" }
    }
  }
}

# Daily indices share one prefix so all four Kibana views can search them.
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${ELASTICSEARCH_USERNAME:}"
    password => "${ELASTICSEARCH_PASSWORD:}"
    index => "ayn-al-sijill-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
  stdout {
    codec => dots
  }
}
